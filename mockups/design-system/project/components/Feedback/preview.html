<!-- @dsCard group="Feedback" height=200 subtitle="switch, stars, tags, toast, bars" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--ground);font-family:var(--font-sans);color:var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px;max-width:358px}
  .row{display:flex;align-items:center;gap:12px}
  .sw{width:50px;height:30px;border-radius:15px;background:var(--surface-raised);border:0;position:relative}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink)}
  .sw.on{background:var(--ember)}.sw.on::after{transform:translateX(20px)}
  .tag{font:500 11px var(--font-sans);padding:4px 8px;border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink-soft)}
  .tag.good{background:var(--sage-tint);color:var(--sage-bright)}.tag.bad{background:var(--alert-tint);color:var(--alert)}
  .toast{background:var(--ink);color:var(--ground);font:600 13px var(--font-sans);padding:10px 16px;border-radius:var(--radius-md);align-self:center}
  .bar{height:10px;border-radius:var(--radius-pill);background:var(--surface-raised);overflow:hidden;flex:1;display:flex}
  .bar div{height:100%}
</style>
</head>
<body>
  <div class="row"><button class="sw" aria-label="Off"></button><button class="sw on" aria-label="On"></button>
    <span style="display:flex;gap:2px;margin-left:8px" role="img" aria-label="3 of 5 stars">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--ember-bright)" aria-hidden="true"><path d="M12 3l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17.3 6.2 20.5l1.4-6.4L2.7 9.7l6.5-.7z"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--ember-bright)" aria-hidden="true"><path d="M12 3l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17.3 6.2 20.5l1.4-6.4L2.7 9.7l6.5-.7z"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--ember-bright)" aria-hidden="true"><path d="M12 3l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17.3 6.2 20.5l1.4-6.4L2.7 9.7l6.5-.7z"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--line-strong)" stroke-width="1.6" aria-hidden="true"><path d="M12 3l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17.3 6.2 20.5l1.4-6.4L2.7 9.7l6.5-.7z"/></svg>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--line-strong)" stroke-width="1.6" aria-hidden="true"><path d="M12 3l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 17.3 6.2 20.5l1.4-6.4L2.7 9.7l6.5-.7z"/></svg>
    </span>
  </div>
  <div class="row"><span class="tag">white</span><span class="tag good">proof right</span><span class="tag bad">too wet</span><span class="tag good">crust right</span></div>
  <div class="row"><div class="bar"><div style="width:47%;background:var(--ember)"></div></div><div class="bar"><div style="flex:1;background:var(--ember-bright)"></div><div style="flex:48;background:var(--sage)"></div><div style="flex:2;background:var(--wheat)"></div></div></div>
  <div class="toast">Saved · calibration will update after 2 logs</div>
</body>
</html>
