<!-- @dsCard group="Containers" height=300 subtitle="plain result card, tip, hint" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--ground);font-family:var(--font-sans);color:var(--ink);padding:16px;display:flex;flex-direction:column;gap:14px;max-width:358px}
  .card{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-xl);padding:16px;display:flex;flex-direction:column;gap:10px}
  .lbl{font:600 11px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
  .big{font:700 34px var(--font-display);letter-spacing:-.02em;color:var(--ember-bright);font-variant-numeric:tabular-nums}
  .bar{height:10px;border-radius:var(--radius-pill);background:var(--surface-raised);overflow:hidden}
  .fill{height:100%;width:47%;background:var(--ember);border-radius:var(--radius-pill)}
  .row{display:flex;justify-content:space-between;height:34px;align-items:center;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink-soft)}
  .row b{color:var(--ink);font-variant-numeric:tabular-nums}
  .tip{background:var(--ember-tint);border:1px solid var(--ember-line);border-radius:var(--radius-lg);padding:14px;display:flex;gap:10px}
  .hint{background:var(--sage-tint);border:1px solid var(--sage-line);border-radius:var(--radius-xl);padding:14px;display:flex;gap:10px}
  p{margin:4px 0 0;font-size:13px;line-height:1.45}
</style>
</head>
<body>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">Hydration</span><span class="big">63.5<span style="font-size:18px;color:var(--ink-muted)">%</span></span></div>
    <div class="bar"><div class="fill"></div></div>
    <div class="row"><span>Water</span><b style="color:var(--ember-bright)">318 g</b></div>
    <div class="row" style="border:0"><span>Salt</span><b>11.0 g</b></div>
  </div>
  <div class="tip"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ember-bright)" stroke-width="1.8" aria-hidden="true"><path d="M12 3c-3 4-6 6-6 10a6 6 0 0 0 12 0c0-4-3-6-6-10z"/></svg><div><div class="lbl" style="color:var(--ember-bright)">Oven suggestion</div><p>Add 1.5% oil and 1% sugar for browning at 275 °C.</p></div></div>
  <div class="hint"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--sage-bright)" stroke-width="1.8" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg><div><div class="lbl" style="color:var(--sage-bright)">Calibration hint</div><p>Two bakes "too wet". Suggest 63.5% → 61.5%.</p></div></div>
</body>
</html>
